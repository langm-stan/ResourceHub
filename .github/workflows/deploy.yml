name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Nightly, so the FRED figures on Household Finance Data and Bitcoin Mining
  # stay current without a commit. 11:17 UTC is early morning in the U.S.,
  # after FRED has posted the previous day's releases.
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Merges the latest FRED observations into the committed series. It
      # never fails the build: a series that will not download keeps its
      # committed data. An optional FRED_API_KEY secret switches it to the
      # official API.
      - run: node scripts/fetch-fred.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
